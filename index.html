<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#3F78BC">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>사회 마블</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 제목·숫자: ONE 모바일 POP (게임용 둥근 글꼴) · 본문: Pretendard */
@font-face{font-family:'ONE Mobile POP';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2105_2@1.0/ONE-Mobile-POP.woff') format('woff');font-display:swap}
:root{
  --ink:#1D2B44;--dim:#66768F;--line:#D5DFEC;
  --sky1:#8CBFE4;--sky2:#3F78BC;--sky3:#284C82;
  --gold1:#F6D977;--gold2:#E9AC3E;--goldD:#B07420;
  --ok:#3A9A5B;--warn:#D2544B;
  --zA:#AACF8A;--zB:#EDAAC0;--zC:#93C4E4;--zD:#EEC872;
  --tA:#F5F9F0;--tB:#FBF2F5;--tC:#F1F6FA;--tD:#FBF6E9;
  --display:'ONE Mobile POP','Pretendard Variable',Pretendard,system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box}
html{font-size:min(1.85vh,1.04vw);font-size:min(1.85dvh,1.04vw)}
body{
  margin:0;height:100vh;height:100dvh;overflow:hidden;color:var(--ink);
  font-family:'Pretendard Variable',Pretendard,system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  font-weight:600;letter-spacing:-.01em;font-synthesis:none;
  background-color:var(--sky2);
  background-image:
    radial-gradient(circle at 1px 1px, rgba(255,255,255,.13) 1.5px, transparent 0),
    radial-gradient(120% 95% at 50% 0%, var(--sky1) 0%, var(--sky2) 55%, var(--sky3) 100%);
  background-size:2.6rem 2.6rem, 100% 100%;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}
[hidden]{display:none!important}
button{
  font:inherit;color:inherit;cursor:pointer;background:#fff;border:0;border-radius:.8rem;padding:.5rem 1.2rem;
  box-shadow:0 .3rem 0 #B7C5D9,0 .45rem .8rem rgba(20,40,80,.14);
  transition:transform .07s,box-shadow .07s;
}
button:active:not(:disabled){transform:translateY(.25rem);box-shadow:0 .05rem 0 #B7C5D9}
button:disabled{opacity:.42;cursor:default;filter:grayscale(.4)}
.big{font-size:2rem;padding:.7rem 2rem}
.solid{background:linear-gradient(var(--gold1),var(--gold2));color:#5A3200;box-shadow:0 .35rem 0 var(--goldD),0 .5rem 1rem rgba(120,60,0,.25)}
.solid:active:not(:disabled){box-shadow:0 .05rem 0 var(--goldD)}
.neg{color:var(--warn)}
.av{display:inline-grid;place-items:center;flex:0 0 auto;border-radius:50%;background:#fff;line-height:1;font-family:var(--display)}
.av img{width:80%;height:80%;display:block}
img.fx{-webkit-user-drag:none;user-select:none}

/* ---------- 보드 ---------- */
#board{position:fixed;inset:0;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(7,1fr);gap:.38rem;padding:.45rem}
.cell{
  position:relative;min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column;
  background:var(--tc2,#fff);border-radius:.75rem;box-shadow:0 .34rem 0 rgba(8,28,70,.32);
}
.cell.zA{--zc:var(--zA);--tc2:var(--tA)}.cell.zB{--zc:var(--zB);--tc2:var(--tB)}.cell.zC{--zc:var(--zC);--tc2:var(--tC)}.cell.zD{--zc:var(--zD);--tc2:var(--tD)}
.cell .band{flex:0 0 auto;height:1.95rem;display:flex;justify-content:space-between;align-items:center;gap:.3rem;padding:0 .55rem;font-size:1.05rem;color:rgba(29,43,68,.78);background:var(--zc);white-space:nowrap}
.cell .nm{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.8rem;line-height:1.08;word-break:keep-all;min-height:0;padding:0 .3rem 1.6rem}
.cell.owned{box-shadow:inset 0 0 0 .32rem var(--own),0 .34rem 0 rgba(8,28,70,.32)}
.cell.owned .band{background:var(--own);color:#fff}
.cell.owned .nm{justify-content:flex-start;align-items:flex-start;text-align:left;padding:.35rem 36% 0 .7rem;font-size:1.6rem;overflow-wrap:anywhere}
.cell .pill{overflow:hidden;font-size:1.05rem;display:flex;align-items:center;gap:.2rem;min-width:0}
.cell .pill img{width:1.5rem;height:1.5rem;flex:0 0 auto;margin-left:-.2rem}
.cell .toll{font-size:1.1rem}
.cell .toll.up{background:#fff;color:var(--warn);border-radius:.4rem;padding:0 .35rem}
.cell.pick{outline:.32rem dashed #fff;outline-offset:-.55rem;cursor:pointer}
.cell.corner{color:#fff;align-items:center;justify-content:center;padding:.2rem .4rem;text-shadow:0 .12rem 0 rgba(0,0,0,.22)}
.cell.corner .cic{height:3.1rem;flex:0 0 auto}
.cell.corner .cic img{height:100%;width:auto;display:block;filter:drop-shadow(0 0 .35rem rgba(255,255,255,.75)) drop-shadow(0 .15rem .15rem rgba(0,0,0,.25))}
.cell.corner .nm{flex:0 0 auto;font-family:var(--display);font-size:1.9rem;padding:0;margin-top:.1rem}
.cell.corner .tx{font-size:.92rem;line-height:1.15;text-align:center;word-break:keep-all;opacity:.95;margin-top:.15rem}
.k-start{background:linear-gradient(160deg,#4E9D6C,#2C7650)}
.k-rest{background:linear-gradient(160deg,#4A9E9A,#26717A)}
.k-palgwan{background:linear-gradient(160deg,#C46C93,#9C436C)}
.k-yeondeung{background:linear-gradient(160deg,#CF8A48,#A9632A)}
.cell.card{background:linear-gradient(160deg,#F4DE96,#E3B24E)}
.cell.card .nm{gap:.45rem;font-family:var(--display);font-size:1.75rem;color:#6B3A00;padding:0}
.cell.card .nm img{height:3rem;width:auto;flex:0 0 auto;filter:drop-shadow(0 .15rem .15rem rgba(110,60,0,.3))}
.cell.card::after{content:'';position:absolute;inset:-50%;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.55) 50%,transparent 58%);animation:shine 4.5s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%,70%{transform:translateX(-60%)}100%{transform:translateX(60%)}}

/* 건물: 땅에서 솟아오른다 */
.bld{position:absolute;right:.35rem;bottom:.3rem;height:50%;transform-origin:50% 100%;z-index:1;pointer-events:none}
.bld.l1{height:55%}.bld.l2{height:68%}
.bld img,.bld svg{height:100%;width:auto;display:block;filter:drop-shadow(0 .2rem .15rem rgba(0,0,0,.28))}
.bld.lan{display:flex;gap:.15rem;align-items:flex-end;height:42%}
.bld.pop{animation:rise .75s cubic-bezier(.25,1.6,.5,1) both}
@keyframes rise{0%{transform:scale(.5,0);opacity:0}55%{transform:scale(.92,1.18);opacity:1}78%{transform:scale(1.05,.94)}100%{transform:none}}
.dust{position:absolute;bottom:.2rem;width:1.6rem;height:1.6rem;border-radius:50%;background:rgba(255,255,255,.95);box-shadow:0 0 0 .1rem rgba(0,0,0,.06);opacity:0;animation:dust .8s ease-out .12s both;z-index:2;pointer-events:none}
.dust.d1{right:8%}.dust.d2{right:22%;animation-delay:.18s}.dust.d3{right:0;animation-delay:.24s}
@keyframes dust{0%{transform:scale(.3) translateY(0);opacity:.95}100%{transform:scale(1.6) translateY(-1rem);opacity:0}}

/* 말 (보드 위에 따로 떠 있어서 칸 사이를 통통 뛰어 간다) */
#toks{position:absolute;inset:0;pointer-events:none;z-index:4}
.pin{position:absolute;left:0;top:0;width:3em;height:3.6em;font-size:1rem;transition:transform .21s ease-in-out}
#toks.snap .pin{transition:none}
#board.many .pin{font-size:.82rem}
.pin::after{content:'';position:absolute;left:.85em;top:3.35em;width:1.3em;height:.45em;border-radius:50%;background:rgba(0,0,0,.3)}
.pin .body{position:absolute;inset:0;transform-origin:50% 100%}
.pin .head{position:absolute;left:0;top:0;width:3em;height:3em;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--c);box-shadow:inset -.22em -.22em 0 rgba(0,0,0,.2),0 .15em .3em rgba(0,0,0,.35);border:.14em solid #fff}
.pin .face{position:absolute;left:.42em;top:.42em;width:2.16em;height:2.16em;border-radius:50%;background:#fff;display:grid;place-items:center;line-height:1;font-family:var(--display);color:var(--c)}
.pin .face span{font-size:1.35em;display:grid;place-items:center}
.pin .face img{width:1.25em;height:1.25em;display:block}
.pin.now .body{animation:bob 1s ease-in-out infinite}
.pin.now .head{box-shadow:inset -.22em -.22em 0 rgba(0,0,0,.2),0 0 0 .22em rgba(255,255,255,.75),0 0 1em .3em var(--c)}
.pin .body.hop,.pin.now .body.hop{animation:hop .23s ease-out}
@keyframes bob{50%{transform:translateY(-.35em)}}
@keyframes hop{0%{transform:scale(1.08,.88)}40%{transform:translateY(-1.5em) scale(.95,1.06)}85%{transform:translateY(0) scale(1.06,.92)}100%{transform:none}}

/* ---------- 가운데 ---------- */
#center{
  grid-row:2/7;grid-column:2/7;position:relative;min-height:0;border-radius:1.2rem;padding:1rem 1.5rem 1.1rem;
  display:flex;flex-direction:column;gap:.6rem;
  background:radial-gradient(90% 80% at 50% 30%,#FFFFFF 0%,#EAF4FF 70%,#DCEBFF 100%);
  box-shadow:0 .4rem 0 rgba(8,28,70,.3),inset 0 0 0 .2rem rgba(255,255,255,.8);
}
#c-hud{display:flex;align-items:center;gap:1rem;padding-right:6.5rem}
.turn{display:flex;align-items:center;gap:.7rem;background:var(--tc);color:#fff;border-radius:3rem;padding:.3rem 1.5rem .3rem .35rem;font-size:2.3rem;white-space:nowrap;max-width:62%;overflow:hidden;box-shadow:0 .3rem 0 rgba(0,0,0,.22)}
.turn .av{width:3.3rem;height:3.3rem;font-size:2rem;color:var(--tc)}
.turn b{font-family:var(--display);font-weight:normal;overflow:hidden;text-overflow:ellipsis}
.turn small{font-size:1.4rem;opacity:.9}
.timer{margin-left:auto;font-size:1.5rem;white-space:nowrap;background:#fff;border-radius:3rem;padding:.25rem 1.1rem;box-shadow:0 .25rem 0 #C5D3E6;color:var(--dim)}
.timer{display:flex;align-items:center;gap:.3rem}
.timer img{width:1.9rem;height:1.9rem}
.timer b{font-family:var(--display);font-weight:normal;font-size:2.2rem;color:var(--ink);font-variant-numeric:tabular-nums;margin-left:.3rem}
.timer.up{background:var(--warn);color:#fff;box-shadow:0 .25rem 0 #9E3A33}
#tbtn{position:absolute;top:.9rem;right:1rem;font-size:1.15rem;padding:.35rem .8rem;color:var(--dim);display:flex;align-items:center;gap:.3rem}
#tbtn img{width:1.5rem;height:1.5rem}
#c-mid{flex:1;display:flex;align-items:center;justify-content:center;gap:3rem;min-height:0}
#roll{font-family:var(--display);font-size:3.2rem;padding:1.1rem 3rem;border-radius:1.4rem;color:#5A3200;
  background:linear-gradient(var(--gold1),var(--gold2));box-shadow:0 .5rem 0 var(--goldD),0 .8rem 1.4rem rgba(120,60,0,.3);text-shadow:0 .12rem 0 rgba(255,255,255,.6)}
#roll:active:not(:disabled){box-shadow:0 .1rem 0 var(--goldD)}
#roll.go{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{scale:1.06}}
#c-dice{display:flex;align-items:center;gap:1.8rem}
.cube{width:5.6rem;height:5.6rem;position:relative;transform-style:preserve-3d;--rx:0deg;--ry:0deg;
  transform:rotateX(-20deg) rotateY(24deg) rotateX(var(--rx)) rotateY(var(--ry))}
.cube .f{position:absolute;inset:0;background:linear-gradient(145deg,#fff,#EDF1F7);border-radius:1rem;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:.75rem;box-shadow:inset 0 0 0 .14rem #D2DAE6}
.cube .f i{width:1.05rem;height:1.05rem;border-radius:50%;place-self:center}
.cube .f i.on{background:radial-gradient(circle at 35% 35%,#4A5A75,#1D2B44)}
.cube .f.p1 i.on{background:radial-gradient(circle at 35% 35%,#FF6A5E,#C9221A);width:1.5rem;height:1.5rem}
.cube .p1{transform:translateZ(2.8rem)}.cube .p6{transform:rotateY(180deg) translateZ(2.8rem)}
.cube .p2{transform:rotateY(90deg) translateZ(2.8rem)}.cube .p5{transform:rotateY(-90deg) translateZ(2.8rem)}
.cube .p3{transform:rotateX(90deg) translateZ(2.8rem)}.cube .p4{transform:rotateX(-90deg) translateZ(2.8rem)}
.cube.tumble{animation:tumble .42s linear infinite}
.cube.tumble:nth-child(2){animation-duration:.36s;animation-direction:reverse}
@keyframes tumble{to{transform:rotateX(-20deg) rotateY(24deg) rotateX(360deg) rotateY(720deg)}}
.dwrap{display:flex;gap:1.6rem;perspective:40rem}
.dwrap.toss{animation:toss .42s ease-in-out infinite}
.dwrap.land{animation:drop .6s cubic-bezier(.3,1.5,.5,1) both}
.dwrap.land .cube{animation:settle .6s cubic-bezier(.2,.9,.3,1) both}
@keyframes toss{50%{transform:translateY(-1.6rem)}}
@keyframes drop{0%{transform:translateY(-1.6rem)}60%{transform:translateY(.3rem)}100%{transform:none}}
@keyframes settle{from{transform:rotateX(-20deg) rotateY(24deg) rotateX(calc(var(--rx) + 360deg)) rotateY(calc(var(--ry) + 270deg))}}
.dsum{font-family:var(--display);font-size:3.4rem;color:var(--tc);line-height:1;text-shadow:0 .2rem 0 rgba(0,0,0,.12)}
.dsum small{font-size:1.8rem;margin-left:.2rem}
.dsum.pop{animation:popin .45s cubic-bezier(.2,1.6,.4,1) .35s both}
@keyframes popin{from{transform:scale(0);opacity:0}}
#c-msg{display:flex;justify-content:center}
#c-msg .msg{background:#fff;border-radius:2rem;padding:.35rem 1.4rem;font-size:1.45rem;color:var(--ink);min-height:2.4rem;line-height:1.3;box-shadow:0 .2rem 0 #C9D6E8;max-width:100%;text-align:center}
#c-msg .msg:empty{visibility:hidden}
.legend{display:flex;justify-content:center;flex-wrap:wrap;gap:.35rem .9rem;font-size:1.05rem;color:var(--dim)}
.legend+.legend{margin-top:-.25rem}
.legend .mode img{width:1.3rem;height:1.3rem}
.legend span{display:flex;align-items:center;gap:.35rem;white-space:nowrap}
.legend i{width:1.15rem;height:1.15rem;border-radius:.3rem}
.legend .late{color:#fff;background:var(--warn);border-radius:.5rem;padding:.05rem .6rem}
.legend .mode{gap:.25rem;color:var(--ink);background:#fff;border-radius:1rem;padding:.1rem .7rem .1rem .3rem;box-shadow:0 .12rem 0 #C9D6E8}
.teams{display:grid;grid-template-columns:repeat(var(--n,4),1fr);gap:.7rem}
.team{position:relative;display:flex;align-items:center;gap:.6rem;background:#fff;border-radius:1rem;padding:.45rem .7rem;box-shadow:0 .28rem 0 #C3D1E4;border:.22rem solid transparent;min-width:0}
.team .av{width:3.4rem;height:3.4rem;font-size:2rem;background:var(--c);color:#fff;box-shadow:inset 0 -.25rem 0 rgba(0,0,0,.18)}
.team .av.em{background:color-mix(in srgb,var(--c) 22%,#fff);box-shadow:inset 0 0 0 .2rem var(--c)}
.team .ti{min-width:0;flex:1}
.team.now{border-color:var(--c);box-shadow:0 .28rem 0 var(--c),0 0 1.2rem color-mix(in srgb,var(--c) 45%,transparent);transform:translateY(-.2rem)}
.team .tn{font-size:1.35rem;display:flex;justify-content:space-between;gap:.3rem;white-space:nowrap;overflow:hidden}
.team .tn>span{overflow:hidden;text-overflow:ellipsis}
.team .tg{font-family:var(--display);font-size:2.1rem;line-height:1.1;white-space:nowrap;font-variant-numeric:tabular-nums}
.team .ts{font-size:1rem;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team.out{opacity:.45}
#board.many .team{padding:.35rem .5rem;gap:.4rem}
#board.many .team .av{width:2.5rem;height:2.5rem;font-size:1.45rem}
#board.many .team .tg{font-size:1.65rem}
#board.many .team .tn{font-size:1.15rem}
#board.many .teams{gap:.5rem}
.badge{font-size:.9rem;background:var(--warn);color:#fff;border-radius:.4rem;padding:0 .4rem;align-self:center}
.badge.cheer{background:var(--ok);display:flex;align-items:center;gap:.2rem;padding:0 .35rem 0 .15rem}
.badge.cheer img{width:1.4rem;height:1.4rem}
#board.many .badge.cheer em,#board.many .team .seat{display:none}
.badge em{font-style:normal}
.float{position:absolute;left:50%;top:-.4rem;transform:translateX(-50%);font-family:var(--display);font-size:2rem;white-space:nowrap;pointer-events:none;z-index:6;animation:floatup 1.3s ease-out forwards;text-shadow:0 .12rem 0 #fff,0 -.12rem 0 #fff,.12rem 0 0 #fff,-.12rem 0 0 #fff}
.float.up{color:var(--ok)}.float.down{color:var(--warn)}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,.8rem) scale(.6)}20%{opacity:1;transform:translate(-50%,-.6rem) scale(1.15)}100%{opacity:0;transform:translate(-50%,-3.4rem) scale(1)}}
.mbanner{background:var(--ink);color:#fff;border-radius:.8rem;padding:.6rem 1rem;font-size:1.6rem;display:flex;align-items:center;justify-content:center;gap:1rem}
.mbanner button{font-size:1.3rem;padding:.3rem 1rem;color:var(--ink)}

/* 알림 */
#toast{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%) scale(.8);background:rgba(19,32,62,.92);color:#F6D977;font-family:var(--display);font-size:2.5rem;border-radius:1.2rem;padding:.8rem 2rem;z-index:40;pointer-events:none;transition:opacity .25s,transform .25s cubic-bezier(.2,1.6,.4,1);opacity:0;border:.2rem solid #F6D977;text-align:center;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#tb{position:fixed;left:0;right:0;top:40%;z-index:35;pointer-events:none;display:flex;justify-content:center}
#tb .rib{display:flex;align-items:center;gap:1.2rem;background:var(--c);color:#fff;font-family:var(--display);font-size:4rem;padding:.6rem 4rem .6rem .8rem;border-radius:5rem;box-shadow:0 .5rem 0 rgba(0,0,0,.25),0 1rem 3rem rgba(0,0,0,.3);border:.3rem solid #fff;animation:ribbon 1.5s cubic-bezier(.3,.9,.4,1) forwards}
#tb .rib .av{width:5.4rem;height:5.4rem;font-size:3.3rem;color:var(--c)}
#tb .rib small{font-size:2.4rem;opacity:.92}
@keyframes ribbon{0%{transform:translateX(-120vw) skewX(-12deg)}22%{transform:translateX(0) skewX(0)}78%{transform:translateX(0) scale(1)}100%{transform:translateX(120vw) skewX(12deg)}}
.coin{position:fixed;left:0;top:0;width:2.4rem;height:2.4rem;margin:-1.2rem 0 0 -1.2rem;z-index:45;pointer-events:none;background:url(img/fx/coin.png) center/contain no-repeat;filter:drop-shadow(0 .15rem .2rem rgba(0,0,0,.3))}
.conf{position:fixed;left:0;top:0;width:.9rem;height:.55rem;z-index:45;pointer-events:none;border-radius:.12rem}

/* ---------- 문제 창 (가운데 영역만 덮는다) ---------- */
#modal{position:absolute;inset:0;z-index:5;background:#fff;border-radius:1.2rem;box-shadow:inset 0 0 0 .34rem var(--tc),0 .4rem 0 rgba(8,28,70,.3);overflow:auto;animation:mIn .3s cubic-bezier(.2,1.4,.4,1)}
#modal.flip{animation:flipIn .55s cubic-bezier(.3,1.3,.5,1);transform-origin:50% 50%}
#modal.shake{animation:shake .4s}
@keyframes mIn{from{transform:scale(.88);opacity:0}}
@keyframes flipIn{from{transform:perspective(60rem) rotateY(-100deg);opacity:.2}}
@keyframes shake{20%,60%{transform:translateX(-.8rem)}40%,80%{transform:translateX(.8rem)}}
.mbody{position:relative;min-height:100%;padding:4.2rem 2.2rem 1.6rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.7rem}
.mh{position:absolute;left:2.2rem;right:2.2rem;top:.9rem;display:flex;justify-content:space-between;align-items:center;font-size:1.3rem;color:var(--dim)}
.mh .who{display:flex;align-items:center;gap:.5rem;background:var(--tc);color:#fff;border-radius:3rem;padding:.2rem 1rem .2rem .25rem;font-size:1.5rem}
.mh .who .av{width:2.3rem;height:2.3rem;font-size:1.4rem;color:var(--tc)}
.ztag{border-radius:.5rem;padding:.1rem .7rem;color:var(--ink)}
.mt{font-family:var(--display);font-size:3rem;line-height:1.1;text-align:center}
.mq{font-size:2.05rem;font-weight:700;line-height:1.35;letter-spacing:-.02em;text-align:center;word-break:keep-all;max-width:56rem}
.mp{font-size:1.75rem;line-height:1.4;text-align:center;word-break:keep-all;max-width:56rem}
.opts{display:flex;flex-direction:column;gap:.65rem;width:100%;max-width:54rem}

<script>

const KEY = 'goryeoMarble.v2';
const TC = ['#C9473F','#3B6DB8','#34855A','#7A5AB5','#B96B25','#2A817C'];
const MIN_TEAMS = 2, MAX_TEAMS = TC.length;
// 개인전 기본 이름: 동물 20마리 중에서 무작위
const ANIMALS = [['고양이','cat'],['강아지','dog'],['토끼','rabbit'],['호랑이','tiger'],['사자','lion'],['판다','panda'],['여우','fox'],['곰','bear'],['코알라','koala'],['펭귄','penguin'],
  ['원숭이','monkey'],['돼지','pig'],['병아리','chick'],['개구리','frog'],['부엉이','owl'],['말','horse'],['햄스터','hamster'],['고래','whale'],['코끼리','elephant'],['문어','octopus']];
const randomAnimals = n => shuffle(ANIMALS).slice(0,n).map(a=>a[0]);
const teamNames = () => TC.map((_,k)=>`${k+1}모둠`);
const defaultNamesFor = mode => mode==='team' ? teamNames() : randomAnimals(MAX_TEAMS);
const isTeamName = n => /^\d+모둠$/.test(n);
// 말·카드에 그릴 얼굴: 동물 이름이면 그 동물 그림, 'N모둠'이면 숫자, 아니면 첫 글자
function AV(name){
  const a=ANIMALS.find(x=>x[0]===name); if(a) return IMG(a[1]);
  const m=/^(\d+)모둠$/.exec(name); if(m) return m[1];
  return esc([...String(name)][0] || '?');
}
const isEmoji = name => ANIMALS.some(x=>x[0]===name);
const avHTML = (name, cls='') => `<span class="av ${isEmoji(name)?'em':''} ${cls}">${AV(name)}</span>`;
const WHO = () => S.mode==='team' ? '모둠' : '플레이어';
const ZONE_BG = {A:'var(--zA)',B:'var(--zB)',C:'var(--zC)',D:'var(--zD)'};
const START_GRAIN = 500, LAP_BONUS = 50, PALGWAN_BONUS = 100, NO_LAND_BONUS = 50;
const SHARE_RATE = 0.2;       // 노블레스 오블리주: 바퀴가 끝날 때마다 1등이 곡식의 20%를 꼴찌에게 (모의 140판에서 3배 이상 격차 16% → 3%)
const CATCHUP_BONUS = 150;     // 슬로우 스타터: 꼴찌가 출발점을 지나면 더 받는다 (모의 200판에서 격차가 절반으로 줄어든 값)
const LAN_MULT = [1,2,4];      // 연등(건물) 0·1·2개일 때 통행료 배수
const MONO_MULT = 2, LATE_MULT = 1.5;
const LATE_MS = 10*60000;      // 남은 시간이 10분(짧은 판은 전체의 1/3) 이하면 물가 상승
const TOLL_RATE = 0.8;          // 기본 통행료 = 땅값의 80% (모의 2,000판으로 맞춘 값)
const RULES = {
  catchup:  {name:'슬로우 스타터', icon:'turtle'},
  share:    {name:'노블레스 오블리주', icon:'crown'},
  diceOrder:{name:'선 잡기', icon:'dice'},
  bankrupt: {name:'파산 서바이벌', icon:'bomb'},
};

/* ---------- 판 모양(테마): 시작할 때 고른 문제 묶음에 따라 정해진다 ---------- */
let TH, ZONES, BOARD, CARDS, N, LANDS, ZONE_CELLS, CUR, U;
function applyTheme(id){
  TH = THEMES[id] || THEMES.goryeo;
  ZONES = TH.zones; BOARD = TH.board; CARDS = TH.cards; N = BOARD.length; CUR = TH.cur; U = TH.unit;
  LANDS = BOARD.map((c,i)=>c.type==='land'?i:-1).filter(i=>i>=0);
  ZONE_CELLS = {}; LANDS.forEach(i=>(ZONE_CELLS[BOARD[i].zone] ||= []).push(i));
}
// 보드는 언제나 세계 보드 (고려 보드 데이터는 하던 판 이어하기·문제 원본으로만 남긴다)
const themeFor = packs => 'world';
// 예전에 저장된 '문제 묶음'을 차시 묶음 목록으로 바꾼다
const setsFromPacks = packs => [...new Set((packs||[]).flatMap(id=>PACKS.find(p=>p.id===id)?.sets || []))];
const setCount = id => BANK.filter(q=>q.set===id).length;
function poolFor(setIds){
  const sets = new Set(setIds||[]);
  return BANK.map((q,k)=>sets.has(q.set)?k:-1).filter(k=>k>=0);
}
const idxOf = name => BOARD.findIndex(c=>c.name===name);
const price = i => ZONES[BOARD[i].zone].price;
const lanCost = i => price(i)/2;
const baseToll = i => Math.round(price(i)*TOLL_RATE/10)*10;
const r10 = n => Math.round(n/10)*10;
const cname = i => BOARD[i].type==='card' ? TH.card : BOARD[i].name;

const esc = s => String(s).replace(/[&<>"']/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const rnd = n => Math.floor(Math.random()*n);
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];} return a; }
const sum = a => a.reduce((s,x)=>s+x,0);
// 받침에 따라 조사를 고른다: eul('장터') → '장터를'
const jong = w => { w=String(w).replace(/[^가-힣0-9]+$/,''); const c=w.charCodeAt(w.length-1)-0xAC00; return c>=0 && c<=11171 ? c%28 : (/[0-9]$/.test(w) ? [0,1,1,1,0,0,1,1,1,0][+String(w).slice(-1)] : 0); };
const eul = w => w+(jong(w)?'을':'를'), eun = w => w+(jong(w)?'은':'는'), ro = w => w+(jong(w)&&jong(w)!==8?'으로':'로');
const money = n => `${n}${U}`;
const g = n => `<span class="${n<0?'neg':''}">${money(n)}</span>`;

/* ---------- 상태 ---------- */
let S = load() || blank();
applyTheme(S.theme || 'goryeo');
const ui = {openUnit:null, tab:'rules', busy:false, rolling:false, landed:false, tok:null, shown:null, moveMode:null, showBoard:false, layer:null, lockUntil:0, gsel:0,
  fx:null, fxq:[], money:[], tw:{}};

function blank(prev){
  const mode = prev?.mode || 'solo';
  return {v:2, phase:'setup', mode,
    names: prev?.names?.length===MAX_TEAMS ? [...prev.names] : defaultNamesFor(mode),
    count: prev?.count || prev?.teams?.length || 4,
    minutes: prev?.minutes || 30, sound: prev?.sound ?? true,
    sets: prev?.sets || (prev?.packs ? setsFromPacks(prev.packs) : SETS.filter(x=>x.unit==='u1').map(x=>x.id)), catchup: prev?.catchup ?? true, bankrupt: prev?.bankrupt ?? false, diceOrder: prev?.diceOrder ?? true, share: prev?.share ?? true};
}
// 예전 판에서 저장된 값에는 새 설정이 없을 수 있다 → 빠진 값을 채운다
function load(){
  try{
    const s=JSON.parse(localStorage.getItem(KEY)); if(!s || s.v!==2) return null;
    // 개인전·모둠전이 생기기 전 판: 이름이 '1모둠…' 그대로면 시작 화면에서는 동물 이름으로 바꾼다
    if(s.mode==null){
      const def = Array.isArray(s.names) && s.names.every(isTeamName);
      if(s.phase==='setup' && def){ s.mode='solo'; s.names=randomAnimals(MAX_TEAMS); }
      else s.mode = def ? 'team' : 'solo';
    }
    const d=blank(s);
    for(const k of ['names','count','minutes','sound','sets','catchup','bankrupt','diceOrder','share']) if(s[k]==null) s[k]=d[k];
    while(s.names.length<MAX_TEAMS) s.names.push(randomAnimals(MAX_TEAMS).find(n=>!s.names.includes(n)));
    s.sets = s.sets.filter(id=>SETS.some(x=>x.id===id));
    if(s.phase!=='setup' && !Array.isArray(s.teams)) return null;
    return s;
  }catch(e){ return null; }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

function startGame(){
  const theme = themeFor();
  applyTheme(theme);
  S = {v:2, phase:'play', mode:S.mode, names:S.names, count:S.count, minutes:S.minutes, sound:S.sound,
    sets:S.sets, catchup:S.catchup, bankrupt:S.bankrupt, diceOrder:S.diceOrder, share:S.share, theme, pool:poolFor(S.sets), usedBank:[],
    teams: S.names.slice(0,S.count).map(n=>({name:n, grain:START_GRAIN, pos:0, skip:false, out:false})),
    owner: Array(N).fill(-1), lan: Array(N).fill(0),
    turn:0, turnNo:1, rolled:false, dice:null, pending:null,
    deck: shuffle(CARDS.keys()), deckPos:0, outCount:0,
    remaining: S.minutes*60000, paused:false, timeUp:false, late:false, usedQ:{},
    msg:'', hist:[]};
  // 시작할 때 모두 주사위를 굴려 큰 수부터 순서를 정한다 (같으면 무작위). 한 판 안에서는 고정.
  let rolls = S.teams.map((_,t)=>({t, d:[1+rnd(6),1+rnd(6)]}));
  if(S.diceOrder){ rolls = shuffle(rolls).sort((a,b)=>(b.d[0]+b.d[1])-(a.d[0]+a.d[1])); S.order = rolls.map(r=>r.t); }
  else S.order = S.teams.map((_,t)=>t);
  S.turn = S.order[0];
  S.msg = `${S.teams[S.turn].name}부터 시작해요.`;
  startTurn();
  if(S.diceOrder) S.pending = {kind:'order', rolls};
  else ui.fxq.push(turnBanner);
  save(); render();
}

/* 살아 있는 모둠 (파산 서바이벌에서 탈락한 모둠은 건너뛴다) */
const alive = t => !S.teams[t].out;
const ORD = () => S.order || S.teams.map((_,t)=>t);      // 차례 순서 (예전 판은 1모둠부터)
const seat = t => ORD().indexOf(t);
const aliveList = () => ORD().filter(alive);
const firstAlive = () => aliveList()[0];
const lastAlive = () => aliveList().slice(-1)[0];
function nextAlive(t){ const o=ORD(); for(let k=1;k<=o.length;k++){ const n=o[(seat(t)+k)%o.length]; if(alive(n)) return n; } return t; }

/* 차례 시작 상태를 쌓아 두고 [되돌리기]에 쓴다. 시간은 되돌리지 않는다. */
const SNAP_SKIP = new Set(['hist','remaining','paused','timeUp','sound']);
function snapshot(){ const o={}; for(const k in S) if(!SNAP_SKIP.has(k)) o[k]=S[k]; return JSON.stringify(o); }
function startTurn(){
  S.rolled=false; S.dice=null; ui.landed=false;
  S.pending = S.teams[S.turn].skip ? {kind:'skip'} : null;
  S.hist.push(snapshot()); if(S.hist.length>6) S.hist.shift();
}
function endTurn(){
  S.pending=null;
  if(aliveList().length<=1){ finish(); return; }
  const cur=S.turn, nxt=nextAlive(cur);
  // 시간이 끝났으면 이번 바퀴의 마지막 모둠까지 마치고 끝낸다 (모든 모둠이 같은 횟수)
  if(S.timeUp && seat(nxt)<=seat(cur)){ finish(); return; }
  S.turn=nxt; S.turnNo++;
  startTurn();
  if(seat(nxt)<=seat(cur)) roundShare();   // 한 바퀴가 끝났다
  ui.fxq.push(turnBanner);
  save(); render();
}
/* 노블레스 오블리주: 1등이 곡식의 일부를 꼴찌에게 */
function roundShare(){
  if(!S.share) return;
  const sc=scores().filter(x=>alive(x.t)); if(sc.length<2) return;
  const hi=Math.max(...sc.map(x=>x.total)), lo=Math.min(...sc.map(x=>x.total)); if(hi===lo) return;
  const A=sc.find(x=>x.total===hi).t, B=sc.find(x=>x.total===lo).t, amount=r10(S.teams[A].grain*SHARE_RATE);
  if(amount<=0) return;
  S.teams[A].grain-=amount; S.teams[B].grain+=amount;
  S.msg=`노블레스 오블리주: ${S.teams[A].name} → ${S.teams[B].name} ${CUR} ${money(amount)}`;
  S.pending={kind:'share', from:A, to:B, amount, then:S.pending};
  ui.fxq.push(()=>fly(teamEl(A), teamEl(B)));
}
function canUndo(){ return S.phase==='play' && !ui.busy && (S.rolled || S.hist.length>=2); }
function undo(){
  if(!S.rolled){ if(S.hist.length<2) return; S.hist.pop(); }
  const o = JSON.parse(S.hist[S.hist.length-1]);
  Object.assign(S, o); S.rolled=false; ui.landed=false;
  S.msg = `되돌렸어요. ${S.teams[S.turn].name} 차례부터 다시.`;
  save(); render();
}
function finish(){
  S.phase='over'; S.pending=null; ui.showBoard=false; ui.moveMode=null;
  ui.fxq.push(()=>{ snd('fanfare'); confetti(innerWidth/2, innerHeight*.25, 90); });
  save(); render();
}

/* ---------- 점수 ---------- */
function scores(){
  return S.teams.map((T,t)=>{
    const lands=LANDS.filter(i=>S.owner[i]===t);
    const landV=sum(lands.map(price)), lanV=sum(lands.map(i=>S.lan[i]*lanCost(i)));
    return {t, T, lands, landV, lanV, total:T.grain+landV+lanV, monos:Object.keys(ZONES).filter(z=>isMono(z,t))};
  });
}
// 꼴찌인가: 살아 있는 모둠 가운데 점수가 가장 낮고, 모두 같은 점수는 아닐 때
function isLast(t){
  const tot=scores().filter(x=>alive(x.t)).map(x=>x.total), me=scores()[t].total;
  return tot.length>1 && me===Math.min(...tot) && Math.max(...tot)>me;
}

/* ---------- 칸 효과 ---------- */
function isMono(zone,t){ return ZONE_CELLS[zone].every(i=>S.owner[i]===t); }
// 통행료 = 기본(땅값의 80%) × 연등 배수(1·2·4) × 독점 ×2 × 물가 상승 ×1.5
function tollWith(i, lan, o){
  const z=BOARD[i].zone;
  return r10(baseToll(i)*LAN_MULT[lan]*(isMono(z,o)?MONO_MULT:1)*(S.late?LATE_MULT:1));
}
function tollOf(i){ const o=S.owner[i]; return o<0 ? 0 : tollWith(i, S.lan[i], o); }
const orderFor = q => q.ox ? (q.o[0]==='O'?[0,1]:[1,0]) : shuffle(q.o.map((_,k)=>k));
/* 고려 보드: 땅마다 그 주제 문제 묶음에서, 이 판에서 아직 안 나온 것부터 */
function pickLandQ(name){
  const pool=TH.quiz[name], used=S.usedQ[name] ||= [];
  let cand=pool.map((_,k)=>k).filter(k=>!used.includes(k));
  if(!cand.length){ used.length=0; cand=pool.map((_,k)=>k); }
  const qi=cand[rnd(cand.length)]; used.push(qi);
  return {qi, order:orderFor(pool[qi]), answered:null};
}
/* 세계 보드: 고른 문제 묶음 전체에서, 아직 안 나온 것부터 */
function pickBankQ(){
  let cand=S.pool.filter(k=>!S.usedBank.includes(k));
  if(!cand.length){ S.usedBank=[]; cand=[...S.pool]; }
  const bi=cand[rnd(cand.length)]; S.usedBank.push(bi);
  return {bi, order:orderFor(BANK[bi]), answered:null};
}
const pickFor = i => TH.quiz ? pickLandQ(BOARD[i].name) : pickBankQ();
const qOf = p => p.bi!=null ? BANK[p.bi] : TH.quiz[BOARD[p.cell].name][p.qi];
const isRight = p => p.answered!=null && p.order[p.answered]===0;
function landingPending(i){
  const c=BOARD[i], t=S.turn;
  switch(c.type){
    case 'start': case 'rest': case 'palgwan': return {kind:'info', cell:i};
    case 'yeondeung': return {kind:'lantern', cell:i};
    case 'card': {
      if(S.deckPos>=S.deck.length){ S.deck=shuffle(CARDS.keys()); S.deckPos=0; }
      const ci=S.deck[S.deckPos++], C=CARDS[ci];
      if(C.quiz==='pool') return {kind:'card', cell:i, card:ci, ...pickBankQ()};
      return {kind:'card', cell:i, card:ci, order: C.quiz ? shuffle([0,1,2]) : null, answered:null};
    }
    case 'land': {
      const o=S.owner[i];
      if(o<0) return {kind:'land', cell:i, ...pickFor(i)};
      if(o===t) return {kind:'own', cell:i};
      const full=tollOf(i);
      return {kind:'toll', cell:i, to:o, base:baseToll(i), lan:S.lan[i], mono:isMono(c.zone,o), late:S.late, full, half:Math.round(full/2), ...pickFor(i)};
    }
  }
}
function lanternTargets(t){ return LANDS.filter(i=>S.owner[i]===t && S.lan[i]<2); }

/* 곡식을 낸 뒤: 파산 서바이벌에서 빚이 생기면 땅을 팔고, 그래도 모자라면 탈락 */
function settleOrEnd(){
  const t=S.turn, T=S.teams[t];
  if(!(S.bankrupt && T.grain<0)){ endTurn(); return; }
  const value = i => price(i)+S.lan[i]*lanCost(i);
  const mine = LANDS.filter(i=>S.owner[i]===t).sort((a,b)=>value(a)-value(b));
  const sold=[];
  for(const i of mine){
    if(T.grain>=0) break;
    const got=Math.round(value(i)/2); T.grain+=got; sold.push({i, name:BOARD[i].name, got});
    S.owner[i]=-1; S.lan[i]=0;
  }
  S.pending={kind:'settle', sold, out:T.grain<0};
  save(); render();
}

/* 이동: 상태를 먼저 확정·저장한 뒤 그림만 따라간다 (도중에 새로고침해도 두 번 굴리기 없음) */
async function travel(steps, bonus, dice){
  const t=S.turn, T=S.teams[t], from=T.pos, to=(from+steps)%N;
  const passed = from+steps>=N && bonus;
  const extra = passed && S.catchup && isLast(t) ? CATCHUP_BONUS : 0;
  const before = T.grain;
  T.pos=to; if(passed) T.grain+=LAP_BONUS+extra;
  if(dice) S.dice=dice;
  S.pending = landingPending(to);
  save();

  ui.busy=true; ui.tok={t,pos:from}; ui.shown={t,grain:before};
  if(dice){ await rollAnim(); }
  render();
  for(let k=1;k<=steps;k++){
    await wait(240);
    ui.tok.pos=(from+k)%N;
    renderTokens(t);
    if(ui.tok.pos===0 && passed){
      ui.shown.grain=before+LAP_BONUS+extra;
      toast(`${TH.start} 통과 +${money(LAP_BONUS)}${extra?` · 슬로우 스타터 +${money(extra)}`:''}`, extra?2200:1300); snd('coin');
      fly(cellEl(0), teamEl(t), extra?10:6);
      renderCenter();
    } else snd('step');
  }
  await wait(extra?900:450);
  ui.busy=false; ui.tok=null; ui.shown=null;
  render();
}
async function rollAnim(){
  ui.rolling=true; renderCenter(); snd('rattle');
  for(let k=0;k<5;k++){ await wait(120); snd('tick'); }
  ui.rolling=false; ui.landed=true; renderCenter(); snd('dice');
  await wait(800);
}
const wait = ms => new Promise(r=>setTimeout(r,ms));

function roll(){
  if(ui.busy || S.phase!=='play' || S.pending || S.rolled || ui.moveMode!=null || S.paused) return;
  S.rolled=true;
  const d=[1+rnd(6),1+rnd(6)];
  S.msg=`${S.teams[S.turn].name}: 주사위 ${d[0]}+${d[1]} = ${d[0]+d[1]}칸`;
  travel(d[0]+d[1], true, d);
}

/* 모달 버튼 */
const ACT = {
  roll,
  ans(k){
    const p=S.pending; if(!p || p.answered!=null || !p.order) return;
    p.answered=+k;
    const ok=p.order[k]===0;
    snd(ok ? 'ok':'no');
    ui.fxq.push(ok ? ()=>{ const m=document.getElementById('modal'); if(m){ const r=m.getBoundingClientRect(); confetti(r.left+r.width/2, r.top+r.height*.35, 40); } }
                   : ()=>{ const m=document.getElementById('modal'); if(m){ m.classList.remove('shake','flip'); void m.offsetWidth; m.classList.add('shake'); } });
    save(); render();
  },
  buy(){
    const p=S.pending, t=S.turn, T=S.teams[t]; if(p?.kind!=='land') return;
    const i=p.cell; if(T.grain<price(i) || S.owner[i]>=0) return;
    T.grain-=price(i); S.owner[i]=t;
    S.msg=`${T.name}: ${eul(`「${cname(i)}」`)} 샀어요 (-${money(price(i))})`;
    ui.fx={build:i, until:Date.now()+1500};
    ui.fxq.push(()=>fly(teamEl(t), cellEl(i)));
    snd('build'); endTurn();
  },
  pass(){
    const p=S.pending, T=S.teams[S.turn];
    if(p?.kind==='land') S.msg = isRight(p) ? `${T.name}: ${eul(`「${cname(p.cell)}」`)} 사지 않았어요` : `${T.name}: 「${cname(p.cell)}」 문제를 틀려서 못 샀어요`;
    if(p?.kind==='own') S.msg = `${T.name}: 우리 땅 「${cname(p.cell)}」에 쉬었어요`;
    endTurn();
  },
  lantern(){
    const p=S.pending, t=S.turn, T=S.teams[t]; if(p?.kind!=='own') return;
    const i=p.cell; if(S.lan[i]>=2 || T.grain<lanCost(i)) return;
    T.grain-=lanCost(i); S.lan[i]++;
    S.msg=`${T.name}: 「${cname(i)}」에 ${TH.upDone} (-${money(lanCost(i))})`;
    ui.fx={build:i, until:Date.now()+1500};
    ui.fxq.push(()=>fly(teamEl(t), cellEl(i)));
    snd('build'); endTurn();
  },
  pay(){
    const p=S.pending; if(p?.kind!=='toll' || p.answered==null) return;
    const T=S.teams[S.turn], O=S.teams[p.to], amount=isRight(p)?p.half:p.full;
    T.grain-=amount; O.grain+=amount;
    S.msg=`${T.name} → ${O.name} 통행료 ${money(amount)}${isRight(p)?' (정답 할인)':''}`;
    const a=S.turn, b=p.to; ui.fxq.push(()=>fly(teamEl(a), teamEl(b), 9));
    snd('coin'); settleOrEnd();
  },
  info(){
    const p=S.pending; if(p?.kind!=='info') return;
    const c=BOARD[p.cell], T=S.teams[S.turn];
    if(c.type==='palgwan'){ T.grain+=PALGWAN_BONUS; S.msg=`${T.name}: ${TH.festMsg} +${money(PALGWAN_BONUS)}`; snd('coin'); const t=S.turn; ui.fxq.push(()=>fly(cellEl(p.cell), teamEl(t))); }
    if(c.type==='rest'){ T.skip=true; S.msg=`${T.name}: ${TH.restMsg}`; }
    if(c.type==='start'){ S.msg=`${T.name}: ${TH.start}에 도착`; }
    endTurn();
  },
  hang(i){
    const p=S.pending, t=S.turn, T=S.teams[t]; if(p?.kind!=='lantern') return;
    i=+i; if(S.owner[i]!==t || S.lan[i]>=2) return;
    S.lan[i]++; S.msg=`${T.name}: 「${cname(i)}」에 공짜로 ${TH.upDone}`;
    ui.fx={build:i, until:Date.now()+1500};
    snd('build'); endTurn();
  },
  nolan(){
    const p=S.pending, t=S.turn, T=S.teams[t]; if(p?.kind!=='lantern' || lanternTargets(t).length) return;
    T.grain+=NO_LAND_BONUS; S.msg=`${T.name}: ${LANDS.some(i=>S.owner[i]===t)?`${TH.up}이 꽉 차서`:'땅이 없어서'} ${CUR} +${money(NO_LAND_BONUS)}`;
    snd('coin'); endTurn();
  },
  card(){
    const p=S.pending; if(p?.kind!=='card') return;
    const C=CARDS[p.card], T=S.teams[S.turn];
    if(C.quiz){
      if(p.answered==null) return;
      const win = C.quiz==='pool' ? C.win : C.quiz.win;
      if(isRight(p)){ T.grain+=win; S.msg=`${T.name}: ${TH.card} 문제 정답 +${money(win)}`; snd('coin'); }
      else S.msg=`${T.name}: ${TH.card} 문제를 틀렸어요`;
      endTurn(); return;
    }
    const a=C.act;
    if(a.grain){ T.grain+=a.grain; S.msg=`${T.name}: ${TH.card} ${a.grain>0?'+':''}${money(a.grain)}`; snd(a.grain>0?'coin':'no'); settleOrEnd(); return; }
    if(a.freeLantern){ S.pending={kind:'lantern', cell:p.cell, fromCard:true, card:p.card}; save(); render(); return; }
    if(a.moveTo){
      const to=idxOf(a.moveTo), steps=(to-T.pos+N)%N || N;
      S.msg=`${T.name}: ${TH.card}로 「${a.moveTo}」에 가요`;
      travel(steps, !a.noStartBonus, null);
    }
  },
  skip(){
    if(S.pending?.kind!=='skip') return;
    S.teams[S.turn].skip=false;
    S.msg=`${S.teams[S.turn].name}: ${TH.skipMsg}`;
    endTurn();
  },
  shareok(){ const p=S.pending; if(p?.kind!=='share') return; S.pending=p.then||null; save(); render(); },
  orderok(){ if(S.pending?.kind!=='order') return; S.pending=null; ui.fxq.push(turnBanner); save(); render(); },
  settle(){
    const p=S.pending; if(p?.kind!=='settle') return;
    const T=S.teams[S.turn];
    if(p.out){
      T.out=true; T.skip=false; T.outNo=++S.outCount;
      S.owner=S.owner.map(o=>o===S.turn?-1:o);
      S.msg=`${T.name} 파산! 탈락했어요`; snd('no');

  /* 시작 화면 */
  // 다시 그리기 전에 입력한 이름을 먼저 담아 둔다 (안 그러면 지워진다)
  minus(){ readNames(); S.minutes=Math.max(5,S.minutes-5); renderSetup(); },
  plus(){ readNames(); S.minutes=Math.min(90,S.minutes+5); renderSetup(); },
  tminus(){ readNames(); S.count=Math.max(MIN_TEAMS,S.count-1); renderSetup(); },
  tplus(){ readNames(); S.count=Math.min(MAX_TEAMS,S.count+1); renderSetup(); },

  reroll(){ readNames(); S.names=randomAnimals(MAX_TEAMS); snd('rattle'); renderSetup(); },

  fs(){

  // 문제 고르기: 단원(열기·모두 선택·모두 해제) → 주제 하나씩
  unitOpen(u){ readNames(); ui.openUnit = ui.openUnit===u ? null : u; renderSetup(); },
  unitAll(u){ readNames(); const ids=SETS.filter(x=>x.unit===u).map(x=>x.id); S.sets=[...new Set([...S.sets,...ids])]; renderSetup(); },
  unitNone(u){ readNames(); const ids=new Set(SETS.filter(x=>x.unit===u).map(x=>x.id)); S.sets=S.sets.filter(x=>!ids.has(x)); renderSetup(); },
  unitToggle(u){ const ids=SETS.filter(x=>x.unit===u).map(x=>x.id); ids.every(x=>S.sets.includes(x)) ? ACT.unitNone(u) : ACT.unitAll(u); },
  setT(id){ readNames(); S.sets = S.sets.includes(id) ? S.sets.filter(x=>x!==id) : [...S.sets, id]; renderSetup(); },

  board(){ ui.showBoard=true; render(); },

    if(!canUndo()) return;
    const who = S.rolled ? S.teams[S.turn].name : `앞 ${WHO()}`;
    ask(`${who} 차례가 시작될 때로 되돌릴까요?`, ()=>undo());

  endAsk(){ ask('지금 게임을 끝내고 결과를 볼까요?', ()=>finish()); },
  newAsk(){ ask('새 게임을 시작할까요? 지금 판은 지워져요.', ()=>{ S=blank(S); ui.moveMode=null; ui.showBoard=false; save(); render(); }); },
  yes(){ const f=ui.layer?.yes; ui.layer=null; renderLayer(); f && f(); },

document.addEventListener('click', e=>{
  const now=Date.now();
  const cell=e.target.closest('[data-cell]');
  if(ui.moveMode!=null && cell){
    const t=ui.moveMode, i=+cell.dataset.cell;
    S.teams[t].pos=i; S.msg=`교사: ${S.teams[t].name} 말을 ${ro(`「${cname(i)}」`)} 옮겼어요`;
    ui.moveMode=null; save(); render(); return;
  }
  const b=e.target.closest('[data-act]'); if(!b || b.disabled) return;
  const act=b.dataset.act, inLayer=!!b.closest('#layer');

  if(!inLayer && now<ui.lockUntil) return;
  if(ui.busy && act!=='lclose') return;
  ui.lockUntil = now+400;
  ACT[act] && ACT[act](b.dataset.v);
});

let lastTick=Date.now();
setInterval(()=>{
  const now=Date.now(), d=now-lastTick; lastTick=now;
  if(S.phase!=='play') return;
  if(!S.paused && S.remaining>0){
    S.remaining=Math.max(0,S.remaining-d);
    if(S.remaining===0){ S.timeUp=true; toast(`시간 끝! ${S.teams[lastAlive()].name} 차례까지 하고 끝나요`, 2500); if(!ui.busy) render(); }
    if(!S.late && S.remaining>0 && S.remaining<=Math.min(LATE_MS, S.minutes*60000/3)){ S.late=true; toast(`물가 상승! 통행료 ×${LATE_MULT}`); snd('no'); if(!ui.busy) render(); }
    save(); renderTimer();
  }
  // 시간이 끝났고 새 바퀴가 막 시작되려는 참(첫 모둠이 아직 안 굴림)이면 바로 결과로
  if(S.timeUp && !ui.busy && !S.rolled && S.turn===firstAlive() && S.pending?.kind!=='settle') finish();
}, 500);

function gridPos(i){
  if(i<=6) return [1, i+1];
  if(i<=11) return [i-5, 7];
  if(i<=18) return [7, 7-(i-12)];
  return [7-(i-18), 1];
}
function bldHTML(i){
  const o=S.owner[i], lan=S.lan[i], c=TC[o];
  const pop = ui.fx && ui.fx.build===i && Date.now()<ui.fx.until;
  const art = TH.icon==='house' || !lan ? IMG(BLD[TH.icon==='house'?lan:0]) : LANTERN_SVG().repeat(lan);
  const cls = TH.icon==='house' || !lan ? `l${lan}` : 'lan';
  return `<div class="bld ${cls} ${pop?'pop':''}">${art}</div>${pop?'<i class="dust d1"></i><i class="dust d2"></i><i class="dust d3"></i>':''}`;
}
function cellParts(i){
  const c=BOARD[i];
  let cls='cell', inner='', style='';
  if(c.type==='land'){
    const z=ZONES[c.zone], o=S.owner[i];
    cls+=' z'+c.zone;
    if(o>=0){
      cls+=' owned'; style=`--own:${TC[o]}`;
      const tl=tollOf(i);
      inner=`<div class="band"><span class="pill">${isEmoji(S.teams[o].name)?AV(S.teams[o].name):''}${esc(S.teams[o].name)}</span><span class="toll ${tl>baseToll(i)?'up':''}">통행 ${tl}</span></div><div class="nm">${esc(c.name)}</div>${bldHTML(i)}`;
    } else inner=`<div class="band"><span>땅 ${z.price}</span><span>통행 ${r10(baseToll(i)*(S.late?LATE_MULT:1))}</span></div><div class="nm">${esc(c.name)}</div>`;
  } else if(c.type==='card'){
    cls+=' card';
    inner=`<div class="nm">${CARDICON('bigl')}<span>${esc(TH.card)}</span></div>`;
  } else {
    cls+=' corner k-'+c.type;
    inner=`<div class="cic">${CORNER_ICON[c.type]||''}</div><div class="nm">${esc(c.name)}</div><div class="tx">${esc(c.text)}</div>`;
  }
  if(ui.moveMode!=null) cls+=' pick';
  const [r,col]=gridPos(i);
  return {cls, style:`grid-row:${r};grid-column:${col};${style}`, inner};
}

const cellEl = i => document.querySelector(`.cell[data-cell="${i}"]`);
const teamEl = t => document.querySelector(`.team[data-t="${t}"]`);
function renderTokens(hopT, snap){
  const layer=document.getElementById('toks'); if(!layer) return;
  const pos = S.teams.map((T,t)=>ui.tok && ui.tok.t===t ? ui.tok.pos : T.pos);
  const groups={};
  let fresh=!!snap;
  S.teams.forEach((T,t)=>{
    let el=layer.querySelector(`[data-pin="${t}"]`);
    if(!alive(t)){ el && el.remove(); return; }
    if(!el){ el=document.createElement('div'); el.className='pin'; el.dataset.pin=t; el.innerHTML='<div class="body"><div class="head"></div><div class="face"><span></span></div></div>'; layer.appendChild(el); fresh=true; }
    el.style.setProperty('--c', TC[t]);
    const face=el.querySelector('.face span'), av=AV(T.name);
    if(face._av!==av){ face.innerHTML=av; face._av=av; }
    el.classList.toggle('now', t===S.turn && S.phase==='play');
    (groups[pos[t]] ||= []).push(t);
  });
  if(fresh) layer.classList.add('snap');
  for(const [cell, ts] of Object.entries(groups)){
    const ce=cellEl(cell); if(!ce) continue;
    const L=ce.offsetLeft, Tp=ce.offsetTop, W=ce.offsetWidth, H=ce.offsetHeight;
    const pw=layer.querySelector(`[data-pin="${ts[0]}"]`).offsetWidth || 30;
    const land=BOARD[cell].type==='land', m=ts.length;
    const avail=(land ? W*.6 : W*.88) - pw;
    const sp = m>1 ? Math.min(pw*1.02, avail/(m-1)) : 0;
    const x0 = land ? L + W*.05 + pw/2 : L + W/2 - sp*(m-1)/2;
    const y = Tp + H*.97;
    // 지금 차례인 말을 맨 위에
    ts.forEach((t,j)=>{
      const el=layer.querySelector(`[data-pin="${t}"]`);
      el.style.transform=`translate(${Math.round(x0+sp*j-pw/2)}px,${Math.round(y-pw*1.2)}px)`;
      el.style.zIndex = t===S.turn ? 20 : j+1;
    });
  }
  if(fresh){ void layer.offsetWidth; requestAnimationFrame(()=>layer.classList.remove('snap')); }
  if(hopT!=null){ const b=layer.querySelector(`[data-pin="${hopT}"] .body`); if(b){ b.classList.remove('hop'); void b.offsetWidth; b.classList.add('hop'); } }
}

    const badge = X.out ? '<span class="badge">파산</span>' : X.skip ? '<span class="badge">쉼</span>' : last[k] ? `<span class="badge cheer">${RULE_ICON.turtle}<em>슬로우 스타터</em></span>` : '';
    return `<div class="team ${k===t?'now':''} ${X.out?'out':''}" data-t="${k}" style="--c:${TC[k]}">${avHTML(X.name)}
      <div class="ti"><div class="tn"><span>${esc(X.name)}</span>${badge}</div>
      <div class="tg" id="tg-${k}">${X.out?'탈락':''}</div>
      <div class="ts"><span class="seat">${seat(k)+1}번 · </span>땅 ${lands.length} · ${TH.up} ${lan}</div></div></div>`;

/* 돈: 바뀌면 숫자가 차르륵 올라가고(내려가고) 카드 위로 +/− 가 떠오른다 */
function updateMoney(){
  S.teams.forEach((X,k)=>{
    if(X.out) return;
    const target = ui.shown && ui.shown.t===k ? ui.shown.grain : X.grain;
    const prev = ui.money[k];
    ui.money[k] = target;
    if(prev==null || prev===target){ if(!ui.tw[k]) paintMoney(k, target); return; }
    const card=teamEl(k);
    if(card){ const f=document.createElement('div'); f.className='float '+(target>prev?'up':'down'); f.textContent=`${target>prev?'+':'−'}${money(Math.abs(target-prev))}`; card.appendChild(f); setTimeout(()=>f.remove(),1400); }
    const from = ui.tw[k] ? ui.tw[k].cur : prev;
    ui.tw[k] = {from, to:target, cur:from, t0:performance.now()};
    requestAnimationFrame(tweenMoney);
  });
}
function paintMoney(k, v){ const el=document.getElementById('tg-'+k); if(!el) return; const s=money(v); if(el.textContent!==s) el.textContent=s; el.classList.toggle('neg', v<0); }
function tweenMoney(now){
  let more=false;
  for(const k in ui.tw){
    const w=ui.tw[k], p=Math.min(1,(now-w.t0)/650), e=1-Math.pow(1-p,3);
    w.cur=Math.round(w.from+(w.to-w.from)*e); paintMoney(k, w.cur);
    if(p<1) more=true; else delete ui.tw[k];
  }
  if(more) requestAnimationFrame(tweenMoney);
}

  if(box._h!==m.body){ box.querySelector('.mbody').innerHTML=m.body; box._h=m.body; }
}

        + `<div class="btns">${full ? '' : `<button class="big solid" data-act="lantern" ${T.grain<cost?'disabled':''}>${TH.upAct} (${money(cost)})</button>`}<button class="big" data-act="pass">${full?'확인':'그냥 두기'}</button></div>`
        + (!full && T.grain<cost ? `<div class="note">${CUR}이 모자라요 (지금 ${money(T.grain)})</div>`:'');

    case 'toll': {

      const parts=[`기본 ${p.base}`]; if(p.lan) parts.push(`${TH.up} ${p.lan}${TH.upN} ×${LAN_MULT[p.lan]}`); if(p.mono) parts.push(`독점 ×${MONO_MULT}`); if(p.late) parts.push(`물가 상승 ×${LATE_MULT}`);

  return {key, body, cls};

    </div>
    <div class="l-right panel">
      <div class="tabs">${tabs.map(([k,l])=>`<button class="${ui.tab===k?'on':''}" data-act="tab" data-v="${k}">${l}</button>`).join('')}</div>
      <div class="tabbody">${body}</div>
    </div>
  </div>`;
}

function renderResult(){
  const sc=scores();
  const live=sc.filter(x=>!x.T.out).sort((a,b)=>b.total-a.total);
  const dead=sc.filter(x=>x.T.out).sort((a,b)=>b.T.outNo-a.T.outNo);
  const el=document.getElementById('result');
  el.innerHTML = `<h2>게임 끝!</h2><div class="ranks" style="--n:${S.teams.length}">${[...live,...dead].map((x,k)=>{
    const rank = x.T.out ? live.length+1+dead.indexOf(x) : 1+live.filter(y=>y.total>x.total).length;
    const delay = `animation-delay:${(S.teams.length-k)*.15}s`;
    if(x.T.out) return `<div class="rk out" style="--c:${TC[x.t]};${delay}"><div class="rh">${avHTML(x.T.name)}<div class="r">${rank}위</div></div><div class="n">${esc(x.T.name)}</div><div class="s">파산</div><div class="none">${x.T.outNo}번째로 탈락했어요</div></div>`;
    return `<div class="rk ${rank===1?'first':''}" style="--c:${TC[x.t]};${delay}">${rank===1?CROWN_IMG:''}
      <div class="rh">${avHTML(x.T.name)}<div class="r">${rank}위</div></div><div class="n">${esc(x.T.name)}</div><div class="s">${x.total}</div>
      <table><tr><td>${CUR}</td><td>${g(x.T.grain)}</td></tr><tr><td>가진 땅값</td><td>${money(x.landV)}</td></tr><tr><td>${TH.up}값</td><td>${money(x.lanV)}</td></tr>
      <tr class="tot"><td>합계</td><td>${money(x.total)}</td></tr></table>
      ${x.monos.map(z=>`<div class="mono">구역 독점: ${ZONES[z].name}</div>`).join('')}
      <div class="chips">${x.lands.length ? x.lands.map(i=>`<span class="chip" style="background:${ZONE_BG[BOARD[i].zone]}">${esc(BOARD[i].name)}${UPICON().repeat(S.lan[i])}</span>`).join('') : '<span class="none">가진 땅 없음</span>'}</div>
    </div>`;}).join('')}</div>
    <div class="btns"><button class="big" data-act="board">보드 보기</button><button class="big solid" data-act="newAsk">새 게임</button></div>`;
}

function renderLayer(){
  const el=document.getElementById('layer'), L=ui.layer;
  if(!L){ el.hidden=true; el.innerHTML=''; return; }
  el.hidden=false;
  let h='';
  if(L.view==='menu'){
    const mid = S.rolled || !!S.pending;
    h = `<h3>교사</h3><div class="grid3">
      <button data-act="undoAsk" ${canUndo()?'':'disabled'}>되돌리기</button>
      <button data-act="gview">${CUR} 조정</button>
      <button data-act="mview" ${mid?'disabled':''}>말 옮기기</button>
      <button data-act="pause">${S.paused?'시간 계속':'시간 멈추기'}</button>
      <button data-act="endAsk">지금 끝내기</button>
      <button data-act="newAsk">새 게임</button></div>
      <div class="note">되돌리기는 직전 차례가 시작될 때로 돌아가요. 말 옮기기는 주사위를 굴리기 전에만 돼요.<br>남은 시간 ${fmt(S.remaining)}${S.paused?' (멈춤)':''}</div>
      <button data-act="lclose">닫기</button>`;
  } else if(L.view==='grain'){
    const T=S.teams[ui.gsel];
    h = `<h3>${CUR} 조정</h3><div class="row">${S.teams.map((X,k)=>`<button class="${k===ui.gsel?'sel':''}" style="--c:${TC[k]}" data-act="gsel" data-v="${k}" ${X.out?'disabled':''}>${esc(X.name)}</button>`).join('')}</div>
      <div class="calc"><span class="sum">${esc(T.name)} ${g(T.grain)}</span></div>
      <div class="row">${[-100,-50,-10,10,50,100].map(n=>`<button data-act="gadd" data-v="${n}">${n>0?'+':''}${n}</button>`).join('')}</div>
      <button data-act="teacher">뒤로</button>`;
  } else if(L.view==='move'){
    h = `<h3>말 옮기기</h3><div class="note">옮길 ${WHO()}를 고른 다음 보드에서 칸을 누르세요. 칸 효과는 없어요.</div>
      <div class="row">${S.teams.map((X,k)=>`<button style="--c:${TC[k]}" class="sel" data-act="msel" data-v="${k}" ${X.out?'disabled':''}>${esc(X.name)}</button>`).join('')}</div>
      <button data-act="teacher">뒤로</button>`;
  } else if(L.view==='confirm'){
    h = `<h3>${esc(L.text)}</h3><div class="row"><button class="big solid" data-act="yes">예</button><button class="big" data-act="lclose">아니요</button></div>`;
  }
  el.innerHTML = `<div class="sheet">${h}</div>`;
}

function render(){
  const setup=document.getElementById('setup'), result=document.getElementById('result');
  setup.hidden = S.phase!=='setup';
  result.hidden = !(S.phase==='over' && !ui.showBoard);
  document.getElementById('backres').hidden = !(S.phase==='over' && ui.showBoard);
  if(S.phase==='setup'){ renderSetup(); document.getElementById('board').innerHTML=''; ui.fxq=[]; return; }
  ensureBoard(); renderCells(); renderCenter(); renderTokens();
  if(S.phase==='over') renderResult();
  const q=ui.fxq; ui.fxq=[]; q.forEach(f=>{ try{ f(); }catch(e){ console.error(e); } });
}

/* ---------- 효과: 알림·차례 띠·동전·꽃가루 ---------- */
let toastT;
function toast(text, ms=1300){
  const el=document.getElementById('toast'); if(!el) return;
  el.textContent=text; el.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'), ms);
}
function turnBanner(){
  if(S.phase!=='play') return;
  const T=S.teams[S.turn], el=document.getElementById('tb');
  el.innerHTML=`<div class="rib" style="--c:${TC[S.turn]}">${avHTML(T.name)}<span>${esc(T.name)} <small>차례!</small></span></div>`;
  snd('whoosh');
}
function center(el){ const r=el.getBoundingClientRect(); return [r.left+r.width/2, r.top+r.height/2]; }
function fly(fromEl, toEl, n=7){
  if(!fromEl || !toEl || !document.body.animate) return;
  const [x0,y0]=center(fromEl), [x1,y1]=center(toEl);
  for(let j=0;j<n;j++){
    const c=document.createElement('div'); c.className='coin'; document.body.appendChild(c);
    const sx=x0+(Math.random()-.5)*40, sy=y0+(Math.random()-.5)*30;
    const mx=(sx+x1)/2+(Math.random()-.5)*80, my=Math.min(sy,y1)-60-Math.random()*60;
    const a=c.animate([
      {transform:`translate(${sx}px,${sy}px) scale(.4)`,opacity:0},
      {transform:`translate(${sx}px,${sy-20}px) scale(1.1)`,opacity:1,offset:.15},
      {transform:`translate(${mx}px,${my}px) scale(1)`,opacity:1,offset:.55},
      {transform:`translate(${x1}px,${y1}px) scale(.6)`,opacity:.9},
    ],{duration:720,delay:j*55,easing:'ease-in-out',fill:'backwards'});
    a.onfinish=()=>{ c.remove(); if(j===n-1) snd('coin'); };
  }
}
const CONF = ['#D25450','#3B6DB8','#3D945E','#EBC35A','#8263BC','#DD8EAE','#2F9893'];
function confetti(x, y, n=40){
  if(!document.body.animate) return;
  for(let j=0;j<n;j++){
    const c=document.createElement('div'); c.className='conf'; c.style.background=CONF[j%CONF.length]; document.body.appendChild(c);
    const ang=Math.random()*Math.PI*2, sp=120+Math.random()*260, dx=Math.cos(ang)*sp, dy=Math.sin(ang)*sp-140;
    const rot=Math.random()*720-360;
    const a=c.animate([
      {transform:`translate(${x}px,${y}px) rotate(0)`,opacity:1},
      {transform:`translate(${x+dx}px,${y+dy}px) rotate(${rot/2}deg)`,opacity:1,offset:.45},
      {transform:`translate(${x+dx*1.2}px,${y+dy+380}px) rotate(${rot}deg)`,opacity:0},
    ],{duration:1400+Math.random()*700,easing:'cubic-bezier(.2,.7,.4,1)'});
    a.onfinish=()=>c.remove();
  }
}

/* 효과음: 파일 없이 브라우저에서 바로 만든다 */
let AC, NOISE;
function snd(kind){
  if(!S.sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    const t0=AC.currentTime;
    const tone=(f,at,d,type='triangle',vol=.16,f2)=>{
      const o=AC.createOscillator(), gn=AC.createGain();
      o.type=type; o.frequency.setValueAtTime(f,t0+at); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t0+at+d);
      gn.gain.setValueAtTime(vol,t0+at); gn.gain.exponentialRampToValueAtTime(.001,t0+at+d);
      o.connect(gn).connect(AC.destination); o.start(t0+at); o.stop(t0+at+d+.02);
    };
    const noise=(at,d,freq,vol=.2,f2)=>{
      if(!NOISE){ NOISE=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate); const ch=NOISE.getChannelData(0); for(let i=0;i<ch.length;i++) ch[i]=Math.random()*2-1; }
      const s=AC.createBufferSource(), bp=AC.createBiquadFilter(), gn=AC.createGain();
      s.buffer=NOISE; bp.type='bandpass'; bp.Q.value=1.2;
      bp.frequency.setValueAtTime(freq,t0+at); if(f2) bp.frequency.exponentialRampToValueAtTime(f2,t0+at+d);
      gn.gain.setValueAtTime(vol,t0+at); gn.gain.exponentialRampToValueAtTime(.001,t0+at+d);
      s.connect(bp).connect(gn).connect(AC.destination); s.start(t0+at); s.stop(t0+at+d+.02);
    };
    switch(kind){
      case 'tick': noise(0,.05,2600,.22); break;
      case 'rattle': for(let k=0;k<6;k++) noise(k*.07,.05,1800+rnd(1500),.2); break;
      case 'dice': noise(0,.09,900,.3); tone(170,0,.12,'sine',.22,80); break;
      case 'step': tone(430,0,.09,'sine',.16,780); break;
      case 'ok': [523,659,784,1047].forEach((f,k)=>tone(f,k*.08,.2,'triangle',.15)); break;
      case 'no': tone(240,0,.18,'square',.07,180); tone(180,.16,.3,'square',.07,120); break;
      case 'coin': tone(988,0,.08,'square',.06); tone(1319,.07,.22,'square',.06); break;
      case 'build': tone(150,0,.2,'sine',.3,55); noise(0,.18,500,.22); tone(1568,.16,.25,'triangle',.12); tone(2093,.24,.35,'triangle',.1); break;
      case 'whoosh': noise(0,.4,350,.16,2600); break;
      case 'fanfare': [523,659,784,1047,784,1047].forEach((f,k)=>tone(f,k*.13,k===5?.7:.18,'triangle',.15)); break;
    }
  }catch(e){}
}

// 그리다가 문제가 생기면 빈 화면 대신 안내를 띄운다
try{ render(); }catch(e){
  console.error(e);
  document.body.insertAdjacentHTML('beforeend', `<div class="screen" style="z-index:99;flex-direction:column;gap:1.4rem;font-size:2rem;text-align:center;color:#fff">화면을 여는 중에 문제가 생겼어요.<br><small style="font-size:1.4rem">${esc(e.message)}</small><button class="big solid" onclick="localStorage.removeItem(KEY);location.reload()">저장된 판 지우고 새로 시작</button></div>`);
}
